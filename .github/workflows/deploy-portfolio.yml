name: Deploy portfolio to Pages

# Manual only: enable Pages (Settings → Pages → Source: GitHub Actions) and run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
        working-directory: portfolio
      - run: npm run build
        working-directory: portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
      - id: deployment
        uses: actions/deploy-pages@v4
