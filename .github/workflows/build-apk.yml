name: Build Android APK

on:
  push:
    branches: [ claude/ai-blog-automation-NkYJ3, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter doctor (diagnostic)
        run: flutter doctor -v

      - name: Generate placeholder app icons
        run: |
          python3 - <<'EOF'
          import struct, zlib, os

          def make_png(size, color=(103, 80, 164)):
              def chunk(name, data):
                  c = struct.pack('>I', len(data)) + name + data
                  return c + struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(list(color) * size) for _ in range(size))
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw))
                      + chunk(b'IEND', b''))

          for dirname, size in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72),
                                  ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144),
                                  ('mipmap-xxxhdpi', 192)]:
              path = f'mobile/android/app/src/main/res/{dirname}'
              os.makedirs(path, exist_ok=True)
              data = make_png(size)
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  with open(f'{path}/{name}', 'wb') as f:
                      f.write(data)
          print("App icons generated")
          EOF
          ls -la mobile/android/app/src/main/res/

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get 2>&1 | tee pub-get.log

      - name: Build debug APK (verbose)
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 --verbose 2>&1 | tee build.log
        continue-on-error: true

      - name: Show APK location
        if: always()
        working-directory: mobile
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== build/ tree ==="
          find build -type d 2>/dev/null | head -50 || echo "No build dir"

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mobile/pub-get.log
            mobile/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::flutter build apk failed — see build-logs artifact for details"
          tail -100 mobile/build.log || true
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-blog-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Save APK to releases/
        run: |
          mkdir -p releases
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk releases/ai_blog_debug.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/ai_blog_debug.apk
          git diff --staged --quiet || git commit -m "ci: update debug APK from GitHub Actions build"
          git push origin HEAD
