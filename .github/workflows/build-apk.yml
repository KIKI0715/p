name: Build Android APK

on:
  push:
    branches: [ claude/ai-blog-automation-NkYJ3, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate placeholder app icons
        run: |
          python3 - <<'EOF'
          import struct, zlib, os

          def make_png(size, color=(103, 80, 164)):
              def chunk(name, data):
                  c = struct.pack('>I', len(data)) + name + data
                  return c + struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(list(color) * size) for _ in range(size))
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(raw))
                      + chunk(b'IEND', b''))

          for dirname, size in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72),
                                  ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144),
                                  ('mipmap-xxxhdpi', 192)]:
              path = f'mobile/android/app/src/main/res/{dirname}'
              os.makedirs(path, exist_ok=True)
              data = make_png(size)
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  with open(f'{path}/{name}', 'wb') as f:
                      f.write(data)
          print("App icons generated")
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-blog-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
