<title>Emberfall Saga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed 3D world; every piece of UI is a thin carved overlay pinned to an edge. Single dark world by choice. */
:root {
  color-scheme: dark;
  --night: #0c111d;
  --dusk: #1a2238;
  --bone: #ece4d2;
  --bone-dim: #a9a595;
  --ember: #ff8a3c;
  --ember-deep: #c2541a;
  --frost: #7fd6ff;
  --gold: #ffd27a;
  --blood: #d8493f;
  --slab: rgba(10, 14, 24, .78);
  --line: rgba(236, 228, 210, .22);
  --display: "Cormorant SC", "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --saga: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia, serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--bone); font-family: var(--body); font-size: 15px; line-height: 1.6; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
#app { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 6, 12, .7) 100%); }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(216, 73, 63, .55) 100%); transition: opacity .5s; }
#fade { position: absolute; inset: 0; pointer-events: none; background: var(--night); opacity: 0; transition: opacity .6s; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; padding-block: 14px; padding-left: var(--gl); padding-right: var(--gr); }
#hud > * { position: absolute; }
.label { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--bone-dim); }

#compass { top: 14px; left: 50%; width: min(420px, 62vw); height: 40px; transform: translateX(-50%); overflow: hidden; border-bottom: 1px solid var(--line);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
#compass::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 1px; height: 9px; background: var(--bone); }
.cm { position: absolute; left: 50%; top: 0; margin-left: -40px; width: 80px; text-align: center; font-family: var(--saga); font-size: 11px; white-space: nowrap; color: var(--bone-dim); will-change: transform; }
.cm.realm { top: 15px; font-size: 13px; color: var(--frost); font-weight: 700; }
.cm.realm.done { color: var(--ember); }
.cm.fire { top: 15px; font-size: 13px; color: var(--ember); }

#boss { top: 68px; left: 50%; transform: translateX(-50%); width: min(460px, 70vw); text-align: center; }
#boss .label { color: var(--frost); }
#boss .bar { margin-top: 4px; }

#quest { top: 14px; left: var(--gl); max-width: 210px; }
#quest h2 { margin: 0 0 6px; font-family: var(--saga); font-size: 15px; font-weight: 700; }
#quest ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; color: var(--bone-dim); }
#quest li::before { content: "◇ "; color: var(--frost); }
#quest li.done { color: var(--bone); }
#quest li.done::before { content: "◆ "; color: var(--ember); }

#topbtns { top: 14px; right: var(--gr); display: flex; gap: 8px; pointer-events: auto; }
.chip { background: var(--slab); border: 1px solid var(--line); padding: 6px 12px; font-family: var(--saga); font-size: 13px; }
.chip:hover { border-color: var(--ember); }

#vitals { left: var(--gl); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(300px, 46vw); }
#vitals .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#vitals .who b { font-family: var(--display); font-size: 20px; letter-spacing: .08em; }
.bar { height: 9px; background: rgba(6, 8, 14, .7); border: 1px solid var(--line); transform: skewX(-18deg); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--ember-deep), var(--ember)); transform-origin: left; transition: transform .25s; }
.bar.frost i { background: linear-gradient(90deg, #2f8fc4, var(--frost)); }
.bar.xp { height: 4px; margin-top: 5px; }
.bar.xp i { background: var(--bone); }

#keys { right: var(--gr); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 3px; font-size: 12px; color: var(--bone-dim); text-align: right; }
#keys kbd { font-family: var(--body); font-size: 11px; color: var(--bone); border: 1px solid var(--line); padding: 0 5px; background: var(--slab); }

#cross { left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border: 1px solid var(--bone); transform: rotate(45deg); opacity: .8; }
#prompt { left: 50%; bottom: 24%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: var(--slab); border: 1px solid var(--line); padding: 8px 14px; font-family: var(--saga); white-space: nowrap; }
#prompt .ring { --p: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--body); font-size: 12px; font-weight: 600;
  background: radial-gradient(var(--night) 56%, transparent 58%), conic-gradient(var(--ember) calc(var(--p) * 1turn), var(--line) 0); }
#toast { left: 50%; top: 24%; transform: translateX(-50%); text-align: center; font-family: var(--saga); font-size: clamp(17px, 2.6vw, 24px); text-shadow: 0 2px 12px #000; opacity: 0; transition: opacity .5s; width: min(90%, 620px); text-wrap: balance; }
#toast.on { opacity: 1; }
#toast small { display: block; font-family: var(--body); font-size: 13px; color: var(--bone-dim); }

/* ---------- touch ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#stick { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 1px solid var(--line); border-radius: 50%; background: rgba(10, 14, 24, .35); }
#stick i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(236, 228, 210, .5); }
#tbtns { position: absolute; right: var(--gr); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 62px); grid-template-rows: repeat(3, 62px); gap: 10px; pointer-events: auto; }
#tbtns button { height: 62px; border-radius: 50%; background: var(--slab); border: 1px solid var(--line); font-family: var(--saga); font-size: 13px; touch-action: none; }
#tbtns #tSlash { grid-column: 2; grid-row: 3; border-color: var(--ember); }
#tbtns #tDodge { grid-column: 1; grid-row: 3; }
#tbtns #tThrow { grid-column: 2; grid-row: 2; }
#tbtns #tUse { grid-column: 1; grid-row: 2; border-color: var(--frost); }
#tbtns #tNova { grid-column: 2; grid-row: 1; border-color: var(--gold); color: var(--gold); }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding-block: 24px; padding-left: var(--gl); padding-right: var(--gr); overflow-y: auto; user-select: text; -webkit-user-select: text; touch-action: pan-y; }
#title { background: linear-gradient(180deg, rgba(12, 17, 29, .25), rgba(12, 17, 29, .86) 78%); align-items: end; }
#title .inner { width: min(680px, 100%); padding-bottom: 6vh; display: grid; gap: 14px; }
#title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(44px, 9vw, 92px); line-height: .95; letter-spacing: .04em; text-wrap: balance; }
#title h1 span { display: block; font-family: var(--saga); font-size: clamp(16px, 2.4vw, 22px); letter-spacing: .3em; color: var(--ember); font-weight: 400; margin-bottom: 10px; }
#title p { margin: 0; max-width: 52ch; color: var(--bone); }
.acts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 6px; }
.btn { background: var(--ember); color: #1a0c02; border: 0; padding: 12px 26px; font-family: var(--saga); font-weight: 700; font-size: 17px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.btn:hover { background: #ffa25f; }
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); clip-path: none; font-weight: 400; font-size: 15px; padding: 11px 18px; }
.btn.ghost:hover { border-color: var(--bone); background: transparent; }

#panel, #journal { background: rgba(6, 9, 16, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { width: min(720px, 100%); background: linear-gradient(180deg, #151b2c, #0f1422); border: 1px solid var(--line); border-top: 3px solid var(--ember); padding: clamp(18px, 4vw, 34px); display: grid; gap: 16px; min-width: 0; }
.sheet header { display: flex; gap: 16px; align-items: center; }
.sheet header img { width: 60px; height: 60px; flex: none; }
.sheet h2 { margin: 0; font-family: var(--saga); font-size: clamp(22px, 4vw, 30px); line-height: 1.2; text-wrap: balance; }
.sheet h3 { margin: 0; font-family: var(--saga); font-size: 17px; }
.sheet p { margin: 0; max-width: 62ch; }
.sheet a { color: var(--ember); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
.kv dt { color: var(--bone-dim); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.loot { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.loot li { border-left: 2px solid var(--ember-deep); padding-left: 14px; display: grid; gap: 4px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { border: 1px solid var(--line); padding: 1px 9px; font-size: 13px; }
.realm-block { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.realm-block.locked { color: var(--bone-dim); }
.realm-block .label { color: var(--ember); }
.sheet .foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.sheet .foot small { color: var(--bone-dim); }

#hud > * { transition: opacity .3s; }
.bar.rage { height: 5px; margin-top: 5px; }
.bar.rage i { background: linear-gradient(90deg, var(--ember), var(--gold)); transform: scaleX(0); }
.bar.rage.full { box-shadow: 0 0 12px var(--gold); border-color: var(--gold); }
#questRunes { display: block; margin-top: 6px; color: var(--gold); }
.dmg { left: 0; top: 0; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--bone); text-shadow: 0 2px 6px #000; animation: dmg .7s ease-out forwards; pointer-events: none; }
.dmg.big { font-size: 32px; color: var(--gold); }
@keyframes dmg { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -48px; } }
.lb { position: absolute; left: 0; right: 0; height: 0; background: #04060b; transition: height .45s; pointer-events: none; }
.lb.t { top: 0; } .lb.b { bottom: 0; }
#app.cine .lb { height: 11%; }
#app.cine #hud > *:not(#toast) { opacity: 0; }
#flash { position: absolute; inset: 0; background: var(--gold); opacity: 0; pointer-events: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 0; }
.stats div { border: 1px solid var(--line); padding: 10px 14px; min-width: 0; }
.stats dt { color: var(--bone-dim); font-size: 13px; }
.stats dd { margin: 0; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { #keys { display: none; } #quest ul { display: none; } #compass { top: 58px; width: 78vw; } #boss { top: 108px; } #toast { top: 30%; } }
@media (pointer: coarse) { #keys { display: none; } #vitals { width: min(200px, 40vw); } #prompt { bottom: 40%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <canvas id="c" aria-label="3D 세계: 모닥불을 중심으로 네 개의 선돌이 서 있다"></canvas>
  <div class="vignette"></div>
  <div id="hurt"></div>
  <div id="flash"></div>

  <div id="hud" hidden>
    <div id="compass" aria-hidden="true"></div>
    <div id="boss" hidden><span class="label">서리 파수꾼</span><div class="bar frost"><i id="bossBar"></i></div></div>
    <div id="quest"><span class="label">여정</span><h2 id="questHead">기록 깨우기 0 / 4</h2><ul id="questList"></ul><span class="label" id="questRunes"></span></div>
    <div id="topbtns"><button class="chip" id="btnJournal">일지 <span aria-hidden="true">J</span></button><button class="chip" id="btnSound" aria-pressed="true">소리 켬</button></div>
    <div id="vitals">
      <div class="who"><b id="whoName"></b><span class="label" id="lvl">Lv 1</span></div>
      <div class="bar"><i id="hpBar"></i></div>
      <div class="bar rage" id="rageWrap"><i id="rageBar"></i></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
    <div id="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Shift</kbd> 질주</span>
      <span><kbd>클릭</kbd> 베기(3연타) · <kbd>우클릭</kbd>/<kbd>Q</kbd> 불씨날 던지기·회수</span>
      <span><kbd>Space</kbd> 구르기 · <kbd>R</kbd> 불씨 폭발 · <kbd>E</kbd> 조사 · <kbd>J</kbd> 일지</span>
    </div>
    <div id="cross"></div>
    <div id="prompt" hidden><span class="ring" id="ring">E</span><span id="promptText"></span></div>

  <div id="touch" hidden>
    <div id="stick" hidden><i></i></div>
    <div id="tbtns"><button id="tNova" hidden>폭발</button><button id="tUse" hidden>조사</button><button id="tThrow">던지기</button><button id="tDodge">구르기</button><button id="tSlash">베기</button></div>
  </div>

  <div class="lb t"></div><div class="lb b"></div>
  <div id="fade"></div>

  <div id="title" class="overlay">
    <div class="inner">
      <h1><span id="tKicker"></span>Emberfall Saga</h1>
      <p id="tLead"></p>
      <div class="acts">
        <button class="btn" id="btnStart">여정 시작</button>
        <button class="btn ghost" id="btnSkip">게임 없이 바로 보기</button>
      </div>
    </div>
  </div>

  <div id="panel" class="overlay" hidden><article class="sheet" id="panelSheet"></article></div>
  <div id="journal" class="overlay" hidden><article class="sheet" id="journalSheet"></article></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   PROFILE — 여기만 고치면 페이지 내용이 바뀝니다.
   블록 종류: {p}, {kv:[[키,값]]}, {tags:[...]}, {loot:[{t,d,tags,href}]}
   ===================================================================== */
const PROFILE = {
  name: 'KIKI',
  role: '모바일 · 백엔드 개발자',
  lead: '모닥불에서 출발해 네 개의 선돌을 찾아가세요. 수호자를 쓰러뜨리고 봉인을 풀면 제 기록이 하나씩 깨어납니다.',
  realms: [
    { id: 'about', label: '소개', place: '기원의 선돌', title: '화면부터 서버까지 혼자 짓는 개발자',
      blocks: [
        { p: 'Flutter로 앱의 화면을 만들고, Node.js와 Firebase로 그 뒤를 받칩니다. 아이디어를 실제로 설치할 수 있는 앱까지 끌고 가는 과정을 좋아합니다.' },
        { p: '최근에는 AI와 나눈 대화를 글로 바꿔 주는 블로그 자동화 플랫폼과 감정 일기 앱 「해피리」를 만들었습니다.' },
        { kv: [['역할', '모바일 · 백엔드 개발'], ['주력', 'Flutter, Node.js, Firebase'], ['관심', 'AI를 일상 도구로 만드는 일']] }
      ] },
    { id: 'skills', label: '기술', place: '무기고의 선돌', title: '손에 익은 무기들',
      blocks: [
        { h: '모바일' }, { tags: ['Flutter', 'Dart', 'Riverpod', 'Android'] },
        { h: '백엔드' }, { tags: ['Node.js', 'Express', 'TypeScript', 'MongoDB'] },
        { h: '클라우드 · 배포' }, { tags: ['Firebase Firestore', 'Cloud Functions', 'Docker', 'Railway', 'GitHub Actions'] },
        { h: 'AI' }, { tags: ['Claude API', '프롬프트 설계'] }
      ] },
    { id: 'projects', label: '프로젝트', place: '전리품의 선돌', title: '지금까지 얻은 전리품',
      blocks: [
        { loot: [
          { t: '해피리 — 감정 일기 앱', d: '하루의 감정을 적고, 분석 화면에서 흐름을 돌아보는 모바일 앱. 하단 내비게이션, 분석, 프로필 화면까지 직접 설계했습니다.', tags: ['Flutter', 'Firebase', 'Cloud Functions'] },
          { t: 'AI 대화 → 개발 블로그 자동화', d: 'AI와 나눈 대화를 저장하고, 다듬어진 개발 글로 바꾼 뒤 Dev.to에 바로 발행하는 모바일 우선 플랫폼.', tags: ['Node.js', 'Express', 'TypeScript', 'MongoDB', 'Claude API', 'Flutter'] }
        ] }
      ] },
    { id: 'contact', label: '연락', place: '전령의 선돌', title: '전령을 보내려면',
      blocks: [
        { p: '함께 만들 일이 있다면 GitHub로 찾아와 주세요.' },
        { kv: [['GitHub', { href: 'https://github.com/kiki0715', text: 'github.com/kiki0715' }]] }
        /* 이메일을 넣으려면: ['Email', 'you@example.com'] 을 kv에 추가 */
      ] }
  ]
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
let seed = 715;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- glyphs (drawn, shared by world + UI) ---------- */
function drawGlyph(id, size, color) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), u = size / 100;
  g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 6 * u; g.lineCap = 'square'; g.lineJoin = 'miter';
  const L = (...p) => { g.beginPath(); g.moveTo(p[0] * u, p[1] * u); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i] * u, p[i + 1] * u); g.stroke(); };
  if (id === 'about') { g.beginPath(); g.arc(50 * u, 42 * u, 20 * u, 0, 7); g.stroke(); L(50, 62, 50, 76); L(32, 92, 50, 76, 68, 92); g.beginPath(); g.arc(50 * u, 42 * u, 5 * u, 0, 7); g.fill(); }
  if (id === 'skills') { L(22, 18, 78, 82); L(78, 18, 22, 82); L(50, 34, 66, 50, 50, 66, 34, 50, 50, 34); }
  if (id === 'projects') { L(22, 40, 50, 16, 78, 40); L(22, 62, 50, 38, 78, 62); L(22, 84, 50, 60, 78, 84); }
  if (id === 'contact') { L(50, 88, 50, 20); L(50, 14, 24, 44); L(50, 14, 76, 44); L(30, 66, 50, 52, 70, 66); }
  return cv;
}
const GLYPH_URL = {};
PROFILE.realms.forEach(r => { GLYPH_URL[r.id] = drawGlyph(r.id, 120, '#ff8a3c').toDataURL(); });

/* ---------- content rendering ---------- */
function blocksHTML(blocks) {
  return blocks.map(b => {
    if (b.p) return `<p>${esc(b.p)}</p>`;

    updatePlayer(dt); updateBlade(dt); updateEnemies(dt); updateBolts(dt); updateWave(dt); updateRunes(); updateShrines(real);
    if (state === 'play') updateCamera(real);
    updateCompass();
    if (toastT > 0) { toastT -= real; if (toastT <= 0) $('#toast').classList.remove('on'); }
  } else if (state === 'cine') updateCine(real);
  else if (state === 'title' || (state === 'journal' && returnState === 'title')) {
    const a = REDUCED ? 0.6 : time * 0.06 + 0.6; camera.position.set(Math.sin(a) * 9.2, 3.4, Math.cos(a) * 9.2); camera.lookAt(0, 2.2, 0);
    hero.position.set(P.x, 0, P.z); blade.position.set(P.x + 0.45, 1, P.z);
  }
  // ambient: embers, snow, breathing lights, drifting aurora
  if (Math.random() < 0.6) spark((Math.random() - 0.5) * 0.9, 0.5, (Math.random() - 0.5) * 0.9, (Math.random() - 0.5) * 0.6, 1.5 + Math.random() * 2, (Math.random() - 0.5) * 0.6, 1.6, 1, 0.45 + Math.random() * 0.3, 0.1, -0.4);
  fireLight.intensity = 2.3 + Math.sin(time * 9) * 0.25 + Math.sin(time * 23) * 0.15;
  moon.position.set(P.x - 30, 50, P.z - 20); moon.target.position.set(P.x, 0, P.z);
  auroraTex.offset.x += real * 0.004;
  updateParticles(dt); updateSnow(real);
  renderer.render(scene, camera);
}

function startGame() {
  $('#title').hidden = true; $('#journal').hidden = true; $('#hud').hidden = false; $('#touch').hidden = !TOUCH;
  state = 'play'; refreshQuest(); initAudio(); startBlend(1.8);
  toast(save.opened.length ? '여정을 이어간다' : '푸른 빛기둥을 따라가라', TOUCH ? '왼쪽을 끌어 이동, 오른쪽을 끌어 둘러보기' : '클릭 베기 · 우클릭 던지기 · Space 구르기', 5);
}
$('#btnStart').onclick = startGame;
if (save.opened.length) $('#btnStart').textContent = '여정 이어가기';

if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ opened: save.opened, xp: save.xp })); } catch (e) {} }
window.__saga = { P, G, enemies, shrines, runes, bolts, wave, save, get state() { return state; }, throwBlade, slash, nova, openPanel, hitEnemy };
hashRoute();
requestAnimationFrame(frame);
})();
</script>
