plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.kiwi.aiblog"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.kiwi.aiblog"
        minSdk 23
        targetSdk 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildTypes {
        release {
            // Debug signing keeps `flutter build apk --release` runnable without a keystore.
            signingConfig signingConfigs.debug
            // R8 / shrinker is off: Firebase + Flutter plugins need extensive keep rules,
            // and an APK that boots reliably matters more than a few MB right now.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}
